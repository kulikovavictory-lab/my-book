    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #d4af37; --accent-hover: #fbbf24; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent); margin: 0 0 10px 0; letter-spacing: 1px; }
        .progress-container { background: var(--card-bg); border-radius: 20px; padding: 15px 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: sticky; top: 10px; z-index: 100; border: 1px solid var(--border); }
        .progress-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
        .progress-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #d4af37, #fbbf24); height: 100%; width: 0%; transition: width 0.4s ease; }
        details { background: var(--card-bg); margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; transition: all 0.3s; }
        summary { padding: 18px 20px; cursor: pointer; font-weight: 600; font-size: 16px; color: var(--text-main); list-style: none; display: flex; justify-content: space-between; align-items: center; transition: background 0.2s; }
        summary:hover { background: rgba(255,255,255,0.05); }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 22px; color: var(--accent); font-weight: 300; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(45deg); }
        .book-list { padding: 10px 20px 20px; border-top: 1px solid var(--border); }
        .book-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); transition: opacity 0.2s; }
        .book-item:last-child { border-bottom: none; }
        input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 24px; height: 24px; border: 2px solid var(--text-muted); border-radius: 6px; margin-right: 15px; cursor: pointer; flex-shrink: 0; transition: all 0.2s; position: relative; }
        input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
        input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: var(--bg-color); font-size: 16px; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        label { cursor: pointer; font-size: 15px; color: var(--text-muted); flex: 1; user-select: none; padding-right: 10px; }
        .author { color: var(--text-main); font-weight: 500; transition: color 0.2s; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; opacity: 0.5; }
        input[type="checkbox"]:checked + label .author { color: var(--text-muted); }
        .prev-btn { background: transparent; border: none; font-size: 22px; cursor: pointer; color: #475569; padding: 0 5px; transition: transform 0.2s, color 0.2s; flex-shrink: 0; }
        .prev-btn:hover { transform: scale(1.2); }
        .prev-btn.active { color: #fbbf24; text-shadow: 0 0 10px rgba(251, 191, 36, 0.4); }
        .archive-badge { font-size: 10px; background: rgba(251, 191, 36, 0.15); color: #fbbf24; padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: none; }
        .prev-btn.active ~ label .archive-badge { display: inline-block; }
    </style>
</head>

    let totalBooks = 0;
    let readBooks = 0;
    const container = document.getElementById('categories');

    for (const cat in libraryData) { totalBooks += libraryData[cat].length; }

    function updateProgress() {
        document.getElementById('progress-numbers').innerText = `${readBooks} / ${totalBooks}`;
        const percent = (readBooks / totalBooks) * 100;
        document.getElementById('progress-bar').style.width = `${percent}%`;
    }

    for (const category in libraryData) {
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        summary.textContent = `${category} (${libraryData[category].length})`;
        details.appendChild(summary);

        const list = document.createElement('div');
        list.className = 'book-list';

        libraryData[category].forEach(book => {
            const author = book[0];
            const title = book[1];
            // Надежный ID на основе названия
            const id = encodeURIComponent(author + "___" + title);

            const item = document.createElement('div');
            item.className = 'book-item';

            const cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.id = `cb_${id}`;
            
            if (localStorage.getItem(`read_${id}`) === 'true') {
                cb.checked = true;
                readBooks++;
            }

            cb.addEventListener('change', (e) => {
                if (e.target.checked) {
                    readBooks++;
                    localStorage.setItem(`read_${id}`, 'true');
                } else {
                    readBooks--;
                    localStorage.setItem(`read_${id}`, 'false');
                }
                updateProgress();
            });

            const prevBtn = document.createElement('button');
            prevBtn.className = 'prev-btn';
            prevBtn.innerHTML = '⭐';
            
            if (localStorage.getItem(`prev_${id}`) === 'true') {
                prevBtn.classList.add('active');
            }

            prevBtn.addEventListener('click', () => {
                const isActive = prevBtn.classList.toggle('active');
                localStorage.setItem(`prev_${id}`, isActive);
            });

            const label = document.createElement('label');
            label.htmlFor = cb.id;
            label.innerHTML = `<span class="author">${author}</span> — ${title} <span class="archive-badge">в архиве</span>`;

            item.appendChild(cb);
            item.appendChild(label);
            item.appendChild(prevBtn);
            list.appendChild(item);
        });

        details.appendChild(list);
        container.appendChild(details);
    }

    updateProgress();
</script>
