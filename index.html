    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --accent: #d4af37; --border: #334155; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 20px; line-height: 1.5; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 50px; }
        header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        h1 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--accent); margin: 0 0 10px 0; letter-spacing: 1px; }
        .progress-container { background: var(--card-bg); border-radius: 20px; padding: 15px 20px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); position: sticky; top: 10px; z-index: 100; border: 1px solid var(--border); }
        .progress-text { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; font-weight: 500; }
        .progress-bar-bg { background: #334155; height: 8px; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, #d4af37, #fbbf24); height: 100%; width: 0%; transition: width 0.4s ease; }
        details { background: var(--card-bg); margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
        summary { padding: 18px 20px; cursor: pointer; font-weight: 600; font-size: 16px; color: var(--text-main); list-style: none; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '+'; font-size: 22px; color: var(--accent); font-weight: 300; transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(45deg); }
        .book-list { padding: 10px 20px 20px; border-top: 1px solid var(--border); }
        .book-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 8px; }
        .book-item:last-child { border-bottom: none; }
        input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 22px; height: 22px; border: 2px solid var(--text-muted); border-radius: 6px; cursor: pointer; flex-shrink: 0; transition: all 0.2s; position: relative; }
        input[type="checkbox"]:checked { background-color: var(--accent); border-color: var(--accent); }
        input[type="checkbox"]:checked::after { content: '✓'; position: absolute; color: var(--bg-color); font-size: 14px; font-weight: bold; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        label { cursor: pointer; font-size: 14px; color: var(--text-muted); flex: 1; user-select: none; }
        .author { color: var(--text-main); font-weight: 500; }
        input[type="checkbox"]:checked + label { text-decoration: line-through; opacity: 0.5; }
        .hearts { display: flex; gap: 2px; flex-shrink: 0; }
        .heart { background: transparent; border: none; font-size: 18px; cursor: pointer; padding: 2px; color: #475569; transition: transform 0.2s, color 0.2s; }
        .heart:active { transform: scale(1.3); }
        .heart.active[data-val="1"] { color: #1e1e1e; text-shadow: 0 0 1px #fff; }
        .heart.active[data-val="2"] { color: #ef4444; }
        .heart.active[data-val="3"] { color: #f97316; }
        .heart.active[data-val="4"] { color: #eab308; }
        .archive-badge { font-size: 9px; background: rgba(212, 175, 55, 0.2); color: var(--accent); padding: 2px 5px; border-radius: 4px; margin-left: 6px; font-weight: 600; text-transform: uppercase; display: none; vertical-align: middle; }
        .book-item.has-rating .archive-badge { display: inline-block; }
    </style>
</head>
